<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LifeSync</title>
    <!-- Favicon icon -->
    <!-- Pignose Calender -->
    <link href="/css/pignose.calendar.min.css" rel="stylesheet">
    <!-- Chartist -->
    <link rel="stylesheet" href="/css/chartist.min.css">
    <link rel="stylesheet" href="/css/chartist-plugin-tooltip.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link href="/css/Homepage.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>


</head>

<body>

<!--*******************
    Preloader start
********************-->
<div id="preloader">
    <div class="loader">
        <svg class="circular" viewBox="25 25 50 50">
            <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10"/>
        </svg>
    </div>
</div>
<!--*******************
    Preloader end
********************-->
<!--**********************************
    Main wrapper start
***********************************-->
<div id="main-wrapper">

    <div class="nav-header">
        <div class="brand-logo">
            <a href="/LifeSync/Homepage">
                <h3 style="text-align:center" ;><strong>LifeSync</strong></h3>
            </a>
        </div>
    </div>

    <!--**********************************
        Nav header start
    ***********************************-->
    <div class="header" style="position: relative;">
        <div class="header-content clearfix">
            <a class="nav-link" href="/LifeSync/Homepage" style="margin-left: 20px;">Home <span class="sr-only">(current)</span></a>
            <div class="header-right">
                <ul class="clearfix">
                    <li class="icons dropdown" style="position: relative;">
                        <div class="user-img c-pointer position-relative" data-toggle="dropdown">
                            <span class="activity active"></span>
                            <img src="" height="40" width="40" alt="">
                        </div>
                        <div class="drop-down dropdown-profile animated fadeIn dropdown-menu"
                             style="position: absolute; top: 100%; left: 0; z-index: 1001; width: 200px;">
                            <div class="dropdown-content-body">
                                <ul>
                                    <li>
                                        <a href="/LifeSync/Profile"><i class="icon-user"></i> <span>Profile</span></a>
                                    </li>
                                    <li><a href="/LifeSync/LogIn"><i class="icon-key"></i> <span>Logout</span></a></li>
                                </ul>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>


    <!--**********************************-->
    <!--**********************************
        Sidebar end
    ***********************************-->
    <!--**********************************
        Content body start
    ***********************************-->
    <br/><br/><br/><br/><br/>
    <div class="container custom-container6">
        <div class="row justify-content-center">
            <br/><br/><br/>
            <div class="content-body mx-auto">

                <div id="inputSection" class="col-lg-12">
                    <div class="card custom-news-card">
                        <div class="card-body">
                            <i class="fas fa-edit edit-icon" id="editB" onclick="giveaccess()"
                               style="font-size: 30px;"></i>
                            <form id="" action="/LifeSync/GroceryEditior" method="post">
                                <div class="text-center">
                                    <h4 style="font-size:40px;"><strong>Grocery List</strong></h4><br/><br/>
                                    <div class="row justify-content-center">
                                        <div class="col-md-6">
                                            <div class="inputs"><label for="titleInput"
                                                                       style="font-size:20px; font-weight:bold;">Title</label>
                                                <input id="titleInput" class="form-control" type="text"
                                                       th:placeholder="${GroceryTitle}" th:value="${GroceryTitle}" name="title">
                                            </div>
                                            <br/><br/>
                                        </div>
                                    </div>
                                    <div class="row justify-content-center ">
                                        <div class="col-md-6">
                                            <div class="inputs">
                                                <label style="font-size:20px; font-weight:bold;">Description</label>
                                                <textarea id="Description" class="form-control" rows="2"
                                                          readonly name="description" th:text="${GroceryDesc}"></textarea>
                                                <br/> <br/>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="row justify-content-center">
                                        <div class="col-md-6">
                                            <div class="inputs"><label
                                                    style="font-size:20px; font-weight:bold;">Type</label> <input
                                                    id="typeInput" class="form-control" type="text"
                                                    readonly name="Type" th:placeholder="${GroceryType}" th:value="${GroceryType}"></div>
                                            <br/><br/>
                                        </div>
                                    </div>
                                    <div class="row justify-content-center">
                                        <div class="col-md-6">
                                            <div class="inputs"><label
                                                    style="font-size:20px; font-weight:bold;">Amount</label> <input
                                                    id="amountInput" class="form-control" type="text"
                                                    th:value="${GroceryAmount}"
                                                    readonly name="Amount" th:placeholder="${GroceryAmount}"></div>
                                            <br/><br/>
                                        </div>
                                    </div>
                                    <br/><br/>
                                    <div class="row justify-content-center">
                                        <button style="width: 260px; margin-left:8px; height: 46px; text-align: center; font-weight: 500; font-size: 20px; display: none; "
                                                id="saveB" class="btn btn-success" type="submit">Save Changes
                                        </button>
                                    </div>
                                    <br/>
                                    <br/>
                                    <br/>
                                    <br/>
                                    <br/>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!--**********************************
        Content body end
    ***********************************-->
    <!--**********************************
        Footer start
    ***********************************-->
    <div class="footer">
        <div class="copyright text-center">
            <p>Copyright &copy; Designed & Developed by <a href="https://themeforest.net/user/quixlab">LifeSync</a> 2023
            </p>
        </div>
    </div>
    <!--**********************************
        Footer end
    ***********************************-->
</div>

</div>
<!--**********************************
    Main wrapper end
***********************************-->
<!--**********************************
    Scripts
***********************************-->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script src="/js/common.min.js"></script>
<script src="/js/custom.min.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/gleek.js"></script>
<script src="/js/styleSwitcher.js"></script>

<!-- Circle progress -->
<script src="/js/circle-progress.min.js"></script>

<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>


<!-- Datamap -->



<script>function giveaccess() {
    document.querySelectorAll('.form-control').forEach(function (input) {
        input.removeAttribute('readonly');
    });
    document.getElementById('editB').style.display = 'none';
    document.getElementById('saveB').style.display = 'inline-block';
}

function savechanges() {
    alert('Profile Updated Successfully!');

    document.querySelectorAll('.form-control').forEach(function (input) {
        input.setAttribute('readonly', true);
    });

    document.getElementById('editB').style.display = 'inline-block';
    document.getElementById('saveB').style.display = 'none';
}</script>


<!-- Initialize Swiper -->
<!-- <script src="./js/dashboard/dashboard-1.js"></script>-->

</body>

</html>
